name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install chromium
          npm ci --ignore-scripts
          npm --prefix v2 ci --ignore-scripts
      - name: V2 MCP tests (POSIX runtime)
        if: runner.os != 'Windows'
        run: npm --prefix v2 test
      - name: V2 public configuration tests
        run: |
          python -m unittest discover -s v2/test -p "*_test.py"
      - name: Run CI (static, unit, smoke, browser full flow, stress)
        env:
          JOB_APPLICATION_TEST_NO_SANDBOX: "1"
        shell: bash
        run: |
          python scripts/ci.py --report test-results/ci.json
      - name: Paired five-template benchmark
        run: python scripts/benchmark_forms.py --runs 3 --out test-results/rea-automation
      - name: Install optional REA integration-test runtime
        run: npm install --no-save --ignore-scripts --package-lock=false rea-agents@6.4.0
      - name: Verify real REA passive capture on owned mock target
        run: python scripts/verify_real_rea.py --rea-entry node_modules/rea-agents/scripts/rea.mjs --out test-results/rea-real
      - name: Verify actual REA learning and cross-application reuse on all five templates
        run: python scripts/test_rea_reuse.py --browser --rea-entry node_modules/rea-agents/scripts/rea.mjs --root test-results/rea-rule-integration
      - name: Retain benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-automation-${{ matrix.os }}
          path: test-results/
          retention-days: 14
