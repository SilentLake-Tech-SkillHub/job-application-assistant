name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        run: |
          python -m pip install openpyxl==3.1.5 playwright==1.56.0
          python -m playwright install chromium
          npm install --global playwright@1.56.0
          npx playwright install chromium
      - name: Run CI (static, unit, smoke, browser full flow, stress)
        shell: bash
        run: |
          export NODE_PATH="$(npm root -g)"
          python scripts/ci.py
